<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#05050a">
  <title>Taurus System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-orb">♉</div>
    <div class="sysline">SYSTEM ONLINE</div>
    <h1>TAURUS <b>SYSTEM</b></h1>
    <p>DISCIPLINA • REGISTRA • EVOLUCIONA</p>
    <div class="loader"><em></em></div>
    <small>Inicializando tu sistema…</small>
  </div>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="avatar-mark">♉</div>
      <div><strong id="drawerName">CAZADOR</strong><small>TAURUS SYSTEM</small></div>
    </div>
    <div id="drawerNav" class="drawer-nav"></div>
    <div class="drawer-quote">DISCIPLINA HOY.<br>RESULTADOS MAÑANA.</div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <div class="shell">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menú">☰</button>
      <div class="brand-mini">
        <div class="mini-mark">♉</div>
        <div><strong>TAURUS <b>SYSTEM</b></strong><small id="topSubtitle">Inicio</small></div>
      </div>
      <div id="rankBadge" class="rank-badge">LV. 1</div>
    </header>

    <main id="app" class="app"></main>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>

  <script>
    window.__taurusSplashFallback=setTimeout(function(){var s=document.getElementById('splash');if(s)s.classList.add('hide');},2600);
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
